<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  <link rel="icon" href="{{ '/assets/logo.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="KurSoftware home">
        {% include logo.svg id="top" size=34 %}
        <span class="wordmark"><b>Kur</b><span>Software</span></span>
      </a>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; {{ site.time | date: "%Y" }} KurSoftware &middot; Apps for iOS &amp; Android</span>
      <a href="mailto:kursoftware@gmail.com">kursoftware@gmail.com</a>
    </div>
  </footer>
</body>
</html>
