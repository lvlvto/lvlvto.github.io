  icon: /assets/icons/quick-math-solver.png
  accent: "#4ECDC4"
  aliases: [speed-math]
  docs:
    - title: Privacy Policy
      kind: privacy
      url: /quick-math-solver/privacy-policy
    - title: Terms and Conditions
      kind: terms
      url: /quick-math-solver/terms-and-conditions
  legacy:
    title: Terms and Conditions (Speed Math)
    url: /speed-math/terms-and-conditions

- slug: quick-geo
  name: QuickGeo
  tagline: Geography quiz — flags, capitals and US states.
  icon: /assets/icons/quick-geo.png
  accent: "#F4A340"
  docs:
    - title: Support
