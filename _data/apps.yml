# One entry per published app. The home page, each app's page and the header
# of every legal document are generated from this list.
#
# slug     folder the app's documents live in, and the app page URL (/slug/)
# aliases  older folders whose documents belong to this app
# kind     privacy | terms | support — picks the icon and blurb on the app page
#
# Store facts shown as tags on the home page and the app page:
# status     live | soon | retired
# platforms  ios, android — the stores a live app is in
# price      free | paid
# price_note short extra next to the price, e.g. a free trial
# stores     App Store numeric id and Google Play package of a live app; each
#            one present becomes a download button
# about      one sentence on what the app is, shown on the app page
# features   short list of what you can do in the app
# shots      screenshots for the app page gallery (540x960 WebP) with alt text
#
# Apps are listed on the home page in the order they appear here.

- slug: progress-tracker
  name: Progo
  tagline: Track your goals and progress with a calendar and home-screen widget.
  icon: /assets/icons/progress-tracker.png
  accent: "#3EA7E6"
  status: live
  platforms: [android]
  stores:
    android: com.lalato.progresstracker
  price: paid
  price_note: 21-day free trial
  about: "Progo keeps your goals, habits and projects in one place and shows how far along you are."
  features:
    - "Set goals with a target value and log progress as you go"
    - "Plan one-off and recurring activities in the calendar"
    - "Break projects into subtasks and watch the percentage grow"
    - "Keep today's progress on a home-screen widget"
    - "Works offline with no account — your data stays on your phone"
  shots:
    - src: /assets/shots/progress-tracker/01.webp
      alt: "Track every goal you set"
    - src: /assets/shots/progress-tracker/02.webp
      alt: "Plan ahead in the calendar"
    - src: /assets/shots/progress-tracker/03.webp
      alt: "Progress on your home screen"
    - src: /assets/shots/progress-tracker/04.webp
      alt: "Your goals stay on your phone"
    - src: /assets/shots/progress-tracker/05.webp
      alt: "See how far you've come"
  docs:
    - title: Privacy Policy
      kind: privacy
      url: /progress-tracker/privacy-policy
    - title: Terms and Conditions
      kind: terms
      url: /progress-tracker/terms-and-conditions
    - title: Support
      kind: support
      url: /progress-tracker/support

