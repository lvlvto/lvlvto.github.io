{%- assign a = include.app -%}
{%- if a.status != "retired" -%}
{%- case a.price -%}
{%- when "free" -%}<span class="tag tag-free">Free</span>
{%- when "paid" -%}<span class="tag tag-paid">Paid</span>
{%- when "subscription" -%}<span class="tag tag-paid">Subscription</span>
{%- endcase -%}
{%- endif -%}
