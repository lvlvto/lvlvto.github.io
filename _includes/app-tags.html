{%- assign a = include.app -%}
<ul class="tags">
  {%- if a.status == "retired" %}
  <li class="tag tag-status">No longer available</li>
  {%- else %}
  {%- if a.status == "soon" %}
  <li class="tag tag-status">Coming soon</li>
  {%- endif %}
  {%- if a.price_note %}
  <li class="tag">{{ a.price_note }}</li>
  {%- endif %}
  {%- endif %}
</ul>
